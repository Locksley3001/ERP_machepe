<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-hidden="true">
  <style>
    svg { background: transparent; }
    .pulse { transform-origin: 256px 256px; animation: pulse .82s ease-out both; }
    .disk { transform-origin: 256px 256px; animation: disk .34s cubic-bezier(.16,1,.3,1) .04s both; }
    .x { stroke-dasharray: 205; stroke-dashoffset: 205; animation: draw .28s cubic-bezier(.22,1,.36,1) forwards; }
    .x.two { animation-delay: .18s; }
    @keyframes pulse {
      0% { transform: scale(.35); opacity: .55; }
      70% { opacity: .18; }
      100% { transform: scale(1.45); opacity: 0; }
    }
    @keyframes disk {
      0% { transform: scale(.1); opacity: 0; }
      72% { transform: scale(1.06); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes draw { to { stroke-dashoffset: 0; } }
  </style>
  <circle class="pulse" cx="256" cy="256" r="145" fill="#ff4a4a"/>
  <circle class="disk" cx="256" cy="256" r="140" fill="#ff4a4a"/>
  <path class="x one" d="M184 184l144 144" fill="none" stroke="#fff" stroke-linecap="round" stroke-width="38"/>
  <path class="x two" d="M328 184L184 328" fill="none" stroke="#fff" stroke-linecap="round" stroke-width="38"/>
</svg>
