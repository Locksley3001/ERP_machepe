<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" role="img" aria-hidden="true">
  <style>
    svg { background: transparent; }
    .pop { transform-origin: 250px 200px; animation: pop .42s cubic-bezier(.16,1,.3,1) both; }
    .inner { transform-origin: 250px 200px; animation: inner .36s cubic-bezier(.16,1,.3,1) .12s both; }
    .check { stroke-dasharray: 135; stroke-dashoffset: 135; animation: draw .34s cubic-bezier(.22,1,.36,1) .42s forwards; }
    .burst { opacity: 0; transform-origin: 250px 200px; animation: burst .72s ease-out .28s both; }
    .dot { opacity: 0; animation: dot .72s ease-out .34s both; }
    @keyframes pop {
      0% { transform: scale(.2); opacity: 0; }
      58% { transform: scale(1.06); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes inner {
      0% { transform: scale(.25); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes burst {
      0% { opacity: 0; transform: scale(.72) rotate(-8deg); }
      22% { opacity: 1; }
      100% { opacity: 0; transform: scale(1.28) rotate(8deg); }
    }
    @keyframes dot {
      0% { opacity: 0; transform: translate(0, 0) scale(.2); }
      24% { opacity: 1; }
      100% { opacity: 0; transform: var(--move) scale(1); }
    }
  </style>
  <g class="burst" fill="none" stroke-linecap="round" stroke-width="12">
    <path stroke="#57b9ff" d="M135 105l-42-32"/>
    <path stroke="#48b44b" d="M365 105l42-32"/>
    <path stroke="#f59e0b" d="M118 245l-54 25"/>
    <path stroke="#e54e40" d="M382 245l54 25"/>
    <path stroke="#48b44b" d="M250 74V22"/>
    <path stroke="#57b9ff" d="M250 326v52"/>
  </g>
  <g class="dot" style="--move: translate(-70px, 48px)" fill="#1674db">
    <circle cx="151" cy="302" r="9"/>
  </g>
  <g class="dot" style="--move: translate(72px, -18px)" fill="#e54e40">
    <circle cx="379" cy="202" r="9"/>
  </g>
  <g class="dot" style="--move: translate(-12px, -60px)" fill="#f59e0b">
    <circle cx="243" cy="83" r="8"/>
  </g>
  <circle class="pop" cx="250" cy="200" r="101" fill="#48b44b"/>
  <circle class="inner" cx="250" cy="200" r="80" fill="#fff"/>
  <path class="check" d="M202 201l34 35 68-78" fill="none" stroke="#48b44b" stroke-linecap="round" stroke-linejoin="round" stroke-width="18"/>
</svg>
